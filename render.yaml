# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: expense-management-ai
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: expense-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: http://tauri.localhost,https://tauri.localhost
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: AI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
    disk:
      name: expense-uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: expense-management-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: expense
    user: expense
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
